name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Linux deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config build-essential

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      # frontend/dist must exist before `go test` (main.go embeds it)
      - name: Build frontend
        run: npm install && npm run build
        working-directory: frontend

      - name: Unit tests
        run: go test ./... -count=1

      - name: Build
        run: wails build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rdeck-${{ matrix.platform }}
          path: |
            build/bin/*
          retention-days: 14
