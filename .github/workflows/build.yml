name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # release asset upload on tag pushes

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Ubuntu 24.04 only ships webkit2gtk-4.1; Wails v2 needs the
      # `webkit2_41` build tag to link against it.
      - name: Install Linux deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config build-essential

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      # frontend/dist must exist before `go test` (main.go embeds it)
      - name: Build frontend
        run: npm install && npm run build
        working-directory: frontend

      - name: Unit tests (linux)
        if: matrix.platform == 'linux'
        run: go test -tags webkit2_41 ./... -count=1

      - name: Unit tests
        if: matrix.platform != 'linux'
        run: go test ./... -count=1

      - name: Build (linux)
        if: matrix.platform == 'linux'
        run: wails build -tags webkit2_41

      - name: Build
        if: matrix.platform != 'linux'
        run: wails build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rdeck-${{ matrix.platform }}
          path: |
            build/bin/*
          retention-days: 14

      # On tag pushes: attach the platform archive to the GitHub release
      - name: Package for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: tar -czf rdeck-${{ github.ref_name }}-${{ matrix.platform }}.tar.gz -C build/bin .

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} --generate-notes --title "${{ github.ref_name }}" 2>/dev/null || true
          gh release upload ${{ github.ref_name }} \
            rdeck-${{ github.ref_name }}-${{ matrix.platform }}.tar.gz --clobber
